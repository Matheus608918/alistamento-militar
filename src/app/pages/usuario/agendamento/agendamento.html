<div class="agendamento-container">

    <h1>Agendamento da Avaliação Médica</h1>

    <p class="erro" *ngIf="erro" role="alert">{{ erro }}</p>

    <ng-container *ngIf="agendamento; else semAgendamento">

        <p>
            Confira abaixo as informações da sua avaliação médica.
        </p>

        <div class="info">

            <label>Data</label>

            <input
                type="text"
                [value]="agendamento.data"
                readonly>

        </div>

        <div class="info">

            <label>Horário</label>

            <input
                type="text"
                [value]="agendamento.horario"
                readonly>

        </div>

        <div class="info">

            <label>Local</label>

            <input
                type="text"
                [value]="agendamento.local"
                readonly>

        </div>

        <div class="info">

            <label>Endereço</label>

            <input
                type="text"
                [value]="agendamento.endereco"
                readonly>

        </div>

        <div class="info" *ngIf="agendamento.medico">

            <label>Médico Responsável</label>

            <input
                type="text"
                [value]="agendamento.medico"
                readonly>

        </div>

        <div class="info">

            <label>Status</label>

            <input
                type="text"
                [value]="agendamento.status"
                readonly>

        </div>

    </ng-container>

    <ng-template #semAgendamento>

        <div class="sem-agendamento" *ngIf="!erro">

            <h2>Nenhuma avaliação agendada</h2>

            <p>

                Aguarde a Junta Militar realizar o agendamento da sua avaliação médica.

            </p>

        </div>

    </ng-template>

</div>
