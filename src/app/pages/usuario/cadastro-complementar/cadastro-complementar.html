<div class="cadastro-container">

  <div class="cadastro-card">

    <div class="topo">
      <h1>Cadastro Complementar</h1>
      <p>Etapa 2 de 2</p>

      <div class="progress">
        <div class="progress-bar"></div>
      </div>
    </div>

    <form [formGroup]="cadastroForm" (ngSubmit)="salvar()">

      <section class="secao">

        <h2>Dados Pessoais</h2>

        <div class="grid">

          <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" formControlName="nome">
          </div>

          <div class="form-group">
            <label>Nome da Mãe</label>
            <input type="text" formControlName="nomeMae">
          </div>

          <div class="form-group">
            <label>Nome do Pai</label>
            <input type="text" formControlName="nomePai">
          </div>

          <div class="form-group">
            <label>CPF</label>
            <input type="text" formControlName="cpf">
          </div>

          <div class="form-group">
            <label>RG</label>
            <input type="text" formControlName="rg">
          </div>

          <div class="form-group">
            <label>Data de Nascimento</label>
            <input type="date" formControlName="dataNascimento">
          </div>

          <div class="form-group">
            <label>Local de Nascimento</label>
            <input type="text" formControlName="localNascimento" placeholder="Cidade/UF">
          </div>

          <div class="form-group">
            <label>Estado Civil</label>
            <select formControlName="estadoCivil">
              <option value="">Selecione</option>
              <option value="Solteiro">Solteiro</option>
              <option value="Casado">Casado</option>
              <option value="Divorciado">Divorciado</option>
              <option value="Viúvo">Viúvo</option>
              <option value="União estável">União estável</option>
            </select>
          </div>

          <div class="form-group">
            <label>Escolaridade</label>
            <select formControlName="escolaridade">
              <option value="">Selecione</option>
              <option value="Fundamental incompleto">Fundamental incompleto</option>
              <option value="Fundamental completo">Fundamental completo</option>
              <option value="Médio incompleto">Médio incompleto</option>
              <option value="Médio completo">Médio completo</option>
              <option value="Superior incompleto">Superior incompleto</option>
              <option value="Superior completo">Superior completo</option>
            </select>
          </div>

          <div class="form-group">
            <label>Telefone</label>
            <input type="text" formControlName="telefone">
          </div>

          <div class="form-group">
            <label>E-mail</label>
            <input type="email" formControlName="email">
          </div>

        </div>

      </section>

      <section class="secao">

        <h2>Endereço</h2>

        <div class="grid">

          <div class="form-group">
            <label>CEP</label>
            <input type="text" formControlName="cep">
          </div>

          <div class="form-group">
            <label>Logradouro</label>
            <input type="text" formControlName="logradouro">
          </div>

          <div class="form-group">
            <label>Número</label>
            <input type="text" formControlName="numero" maxlength="10">
          </div>

          <div class="form-group">
            <label>Bairro</label>
            <input type="text" formControlName="bairro">
          </div>

          <div class="form-group">
            <label>Município</label>
            <input type="text" formControlName="municipio">
          </div>

          <div class="form-group">
            <label>UF</label>
            <input type="text" formControlName="uf" maxlength="2">
          </div>

        </div>

      </section>

      <section class="secao">

        <h2>Informações Gerais</h2>

        <div class="grid">

          <div class="form-group">
            <label>País</label>
            <input type="text" formControlName="pais">
          </div>

          <div class="form-group">
            <label>Zona Residencial</label>
            <input type="text" formControlName="zonaResidencial">
          </div>

        </div>

      </section>

      <button type="submit" [disabled]="enviando">
        {{ enviando ? 'Enviando...' : 'Finalizar Cadastro' }}
      </button>

      <p class="voltar">
        <a routerLink="/cadastro">Voltar para a etapa 1</a>
      </p>

    </form>

  </div>

</div>
