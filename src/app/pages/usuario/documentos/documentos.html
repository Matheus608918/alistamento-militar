<div class="documentos-container">

    <h1>Envio de Documentos</h1>

    <p>
        Envie os documentos necessários para análise da Junta Militar.
    </p>

    <div class="form-group">

        <label>Tipo do Documento</label>

        <select [(ngModel)]="tipoDocumento">

            <option value="">Selecione</option>

            <option value="RG">RG</option>

            <option value="CPF">CPF</option>

            <option value="Certidão de Nascimento">
                Certidão de Nascimento
            </option>

            <option value="Comprovante de Residência">
                Comprovante de Residência
            </option>

            <option value="Certificado de Escolaridade">
                Certificado de Escolaridade
            </option>

        </select>

    </div>

    <div class="form-group">

        <label>Arquivo</label>

        <input
            type="file"
            (change)="selecionarArquivo($event)">

    </div>

    <button
        class="btn-enviar"
        type="button"
        (click)="enviarDocumento()">

        Enviar Documento

    </button>

    <hr>

    <h2>Documentos Enviados</h2>

    <table>

        <thead>

            <tr>

                <th>Documento</th>

                <th>Arquivo</th>

                <th>Data</th>

                <th>Status</th>

                <th>Ações</th>

            </tr>

        </thead>

        <tbody>

            <tr *ngIf="documentos.length === 0">

                <td colspan="5" class="sem-documentos">

                    Nenhum documento enviado.

                </td>

            </tr>

            <tr *ngFor="let doc of documentos; let i = index">

                <td>{{ doc.tipo }}</td>

                <td>{{ doc.nomeArquivo }}</td>

                <td>{{ doc.dataEnvio }}</td>

                <td>

                    <span
                        class="status"
                        [ngClass]="{

                            'status-analise': doc.status === 'Em análise',

                            'status-aprovado': doc.status === 'Aprovado',

                            'status-reprovado': doc.status === 'Reprovado'

                        }">

                        {{ doc.status }}

                    </span>

                </td>

                <td>

                    <button
                        class="btn-excluir"
                        (click)="excluirDocumento(i)">

                        Excluir

                    </button>

                </td>

            </tr>

        </tbody>

    </table>

</div>
