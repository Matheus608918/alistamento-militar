<nav
    class="sidebar"
    [class.aberto]="aberto"
    aria-label="Navegação principal">

    <div class="topo">

        <h2 class="titulo">Alistamento</h2>

        <!-- Botão que só aparece no celular -->
        <button
            type="button"
            class="botao-menu"
            aria-controls="menu-principal"
            [attr.aria-expanded]="aberto"
            (click)="alternar()">

            {{ aberto ? 'Fechar' : 'Menu' }}

        </button>

    </div>

    <ul class="menu" id="menu-principal">

        <li *ngFor="let item of itens()">

            <a
                [routerLink]="item.rota"
                routerLinkActive="ativo"
                [routerLinkActiveOptions]="{ exact: true }"
                ariaCurrentWhenActive="page"
                (click)="fechar()">

                {{ item.texto }}

            </a>

        </li>

    </ul>

    <div class="rodape">

        <button
            type="button"
            class="sair"
            (click)="sair()">

            Sair

        </button>

    </div>

</nav>
