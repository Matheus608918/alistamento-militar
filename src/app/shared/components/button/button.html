<button
    [type]="tipo"
    class="botao"
    [ngClass]="[
        'variante-' + variante,
        'tamanho-' + tamanho,
        blocoCompleto ? 'bloco' : ''
    ]"
    [disabled]="bloqueado"
    [attr.aria-label]="rotuloAcessivel || null"
    [attr.aria-busy]="carregando ? 'true' : null"
    [attr.title]="desabilitado && motivoBloqueio ? motivoBloqueio : null"
    (click)="aoClicar($event)">

    <span
        *ngIf="carregando"
        class="girando"
        aria-hidden="true"></span>

    <ng-content></ng-content>

</button>
